name: weekly-open-source-radar

on:
  schedule:
    # 每周一 09:00 北京时间 = UTC 周一 01:00
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/scan.sh

      - name: Commit report
        run: |
          set -uo pipefail
          DATE="$(date -u '+%Y-%m-%d')"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "radar: ${DATE}"
            git push
          fi
